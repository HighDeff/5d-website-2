<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lilly's Fashion Couture - Latest Updates</title>

    <!-- Better responsive handling -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes, minimum-scale=1.0, maximum-scale=5.0"
    />

    <!-- Cache busting -->
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Responsive meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Preload key resources -->
    <link rel="preload" href="/client/main.tsx" as="script" type="module" />

    <style>
      /* Ensure proper responsive scaling */
      html {
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
        width: 100%;
      }

      /* Loading spinner */
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(
          135deg,
          #f8fafc 0%,
          #fdf2f8 50%,
          #faf5ff 100%
        );
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e5e7eb;
        border-top: 4px solid #8b5cf6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* Better responsive breakpoints */
      @media (max-width: 640px) {
        body {
          font-size: 14px;
        }
      }

      @media (min-width: 641px) and (max-width: 1024px) {
        body {
          font-size: 16px;
        }
      }

      @media (min-width: 1025px) {
        body {
          font-size: 16px;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Loading indicator -->
      <div class="loading">
        <div class="spinner"></div>
      </div>
    </div>

    <script type="module">
      // Add cache busting parameter
      const cacheBuster = Date.now();
      import(`/client/main.tsx?v=${cacheBuster}`);

      // Remove loading indicator once app loads
      window.addEventListener("load", () => {
        const loading = document.querySelector(".loading");
        if (loading) {
          loading.style.display = "none";
        }
      });

      // Force responsive mode compatibility
      if (window.parent !== window) {
        // We're in an iframe (like Builder.io preview)
        document.body.classList.add("iframe-mode");
      }
    </script>
  </body>
</html>
